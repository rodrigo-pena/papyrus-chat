[project]
name = "papyrus-chat"
version = "0.1.0"
description = "Searchable corpus artifact and evidence-grounded chat over papyri/idp.data collections (proof of concept)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lxml>=5.2",
    "platformdirs>=4.2",
    "pydantic>=2.7",
    "pydantic-ai-slim[openai,web]>=2,<3",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
semantic = ["fastembed>=0.4"]

[dependency-groups]
dev = [
    "lxml-stubs>=0.5.1",
    "pytest>=8.2",
    "ruff>=0.5",
    "ty>=0.0.1a5",
]

[project.scripts]
papyrus-corpus-build = "papyrus_chat.builder.cli:app"
papyrus-chat = "papyrus_chat.chat.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/papyrus_chat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not network"]
markers = [
    "network: requires internet access; excluded from the default suite (run with -m network)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Typer's dependency-injection API requires function calls in parameter defaults.
"src/papyrus_chat/*/cli.py" = ["B008"]
