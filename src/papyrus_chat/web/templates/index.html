{% extends "base.html" %}
{% block content %}
<h1>Search the corpus</h1>
<form method="get" action="/search" role="search">
  <label for="query">Search the corpus</label>
  <input type="search" id="query" name="query"
         placeholder="Text, title, or identifier (e.g. TM 23944)">
  <button type="submit">Search</button>
</form>
<section>
  <h2>What you can ask</h2>
  <p>Search above to find papyri, or ask a question about the corpus. Every
  answer shows the exact evidence used.</p>
  <p><a href="/chat" class="button">Ask a question about the corpus</a></p>
</section>
{% endblock %}
