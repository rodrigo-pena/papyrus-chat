<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Papyrus Chat{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <a href="/" class="home-link">Papyrus Chat</a>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>
    <p>Corpus data: <a href="https://github.com/papyri/idp.data">idp.data</a> (CC BY 3.0).
    Answers are model-generated and always shown with the evidence used.</p>
  </footer>
</body>
</html>
